<section class="movie-section">

  <div class="section-header">
    <h2>{{ title }}</h2>
  </div>

  <div class="movie-grid">

    @for (movie of movies; track movie.id) {

      <app-movie-card
        [movie]="movie">
      </app-movie-card>

    } @empty {

      <p>No hay películas disponibles.</p>

    }

  </div>

</section>
